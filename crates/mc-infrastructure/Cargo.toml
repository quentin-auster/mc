[package]
name = "mc-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
async-stream = "0.3"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
mc-application = { path = "../mc-application" }
mc-domain = { path = "../mc-domain" }
object_store = { version = "0.14", features = ["aws"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "process", "time"] }
tracing = "0.1"
walkdir = "2"

[dev-dependencies]
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
