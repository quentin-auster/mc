[package]
name = "mc-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
mc-application = { path = "../mc-application" }
mc-domain = { path = "../mc-domain" }
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
