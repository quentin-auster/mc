name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - master

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features

      - name: Test PostgreSQL migrations
        run: cargo test -p mc-infrastructure --test migrations -- --ignored

      - name: Test PostgreSQL event store
        run: cargo test -p mc-infrastructure --test event_store -- --ignored

      - name: Test repository store
        run: cargo test -p mc-infrastructure --test repository -- --ignored

      - name: Test Git worktrees
        run: cargo test -p mc-infrastructure --test worktree -- --ignored

      - name: Start MinIO
        run: |
          docker run --detach --name mc-ci-minio \
            --publish 59000:9000 \
            --env MINIO_ROOT_USER=mcdev \
            --env MINIO_ROOT_PASSWORD=mc_dev_only_password \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:59000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs mc-ci-minio
          exit 1

      - name: Create artifact bucket
        run: |
          docker run --rm \
            --network container:mc-ci-minio \
            --entrypoint /bin/sh \
            quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z \
            -c 'mc alias set local http://localhost:9000 mcdev mc_dev_only_password && mc mb --ignore-existing local/mc-artifacts'

      - name: Test artifact store
        run: cargo test -p mc-infrastructure --test artifact_store -- --ignored

      - name: Test model provider
        run: cargo test -p mc-infrastructure --test model_provider -- --ignored

      - name: Test context snapshots
        run: cargo test -p mc-infrastructure --test context_snapshot -- --ignored

      - name: Test container sandbox
        run: cargo test -p mc-infrastructure --test sandbox -- --ignored
